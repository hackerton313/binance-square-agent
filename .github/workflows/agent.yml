name: Binance Square Agent

on:
  schedule:
    # كل ساعتين
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
        run: python binance_square_agent.py
      
      - name: Commit posted.json
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add posted.json
          git commit -m "Update posted.json" || echo "No changes"
          git push || echo "No changes"
